{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{% block title %}Acceso · 2J Football Intelligence{% endblock %}</title>
    <style>
      :root{
        --bg:#07101a; --panel:rgba(14,24,40,.98); --line:rgba(145,161,185,.18);
        --text:#f5f7fa; --muted:#95a6be; --muted-soft:#c8d3df;
        --accent:#f4b400; --pitch:#2f7d32;
        --danger:#fecaca; --danger-bg:rgba(127,29,29,.35);
        --success:rgba(220,252,231,.95); --success-bg:rgba(34,197,94,.12);
        --shadow:0 34px 76px rgba(0,0,0,.38);
      }
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;color:var(--text);
        font-family:"Avenir Next","Inter","Segoe UI",sans-serif;
        background:radial-gradient(circle at top left,rgba(47,125,50,.18),transparent 28%),
          radial-gradient(circle at top right,rgba(244,180,0,.14),transparent 24%),
          linear-gradient(180deg,#050b14 0%,#07101a 48%,#09131f 100%);}
      .page{min-height:100vh;display:grid;place-items:center;padding:1rem}
      .card{width:min(440px,100%);border:1px solid var(--line);border-radius:24px;
        box-shadow:var(--shadow);padding:1.6rem;
        background:linear-gradient(180deg,rgba(14,24,40,.98),rgba(10,17,29,.98));}
      .brand{display:flex;align-items:center;gap:.6rem;margin-bottom:1.2rem}
      .brand img{width:132px;max-width:60%;height:auto}
      .eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#fff4cf;font-weight:800}
      h1{margin:.5rem 0 .35rem;font-size:1.5rem;letter-spacing:-.03em;line-height:1.15}
      .sub{margin:0 0 1.1rem;color:var(--muted);line-height:1.55;font-size:.96rem}
      .notice{margin-bottom:.9rem;border-radius:14px;padding:.72rem .82rem;font-size:.92rem;line-height:1.45}
      .notice.error{color:var(--danger);border:1px solid rgba(248,113,113,.45);background:var(--danger-bg)}
      .notice.success{color:var(--success);border:1px solid rgba(34,197,94,.35);background:var(--success-bg)}
      form{display:grid;gap:.85rem}
      .field{display:grid;gap:.35rem}
      label{font-size:.74rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:rgba(245,247,250,.84)}
      input[type=text],input[type=email],input[type=password]{width:100%;min-height:48px;border-radius:14px;
        border:1px solid var(--line);background:rgba(18,28,48,.72);color:var(--text);padding:.82rem .9rem;font-size:.98rem}
      input:focus{outline:none;border-color:rgba(244,180,0,.28);box-shadow:0 0 0 3px rgba(244,180,0,.1)}
      .helptext,.errorlist{font-size:.8rem;color:var(--muted);margin:.15rem 0 0;padding:0;list-style:none;line-height:1.45}
      .errorlist{color:var(--danger)}
      ul.errorlist li{margin-top:.2rem}
      .primary-btn,.ghost-link{display:inline-flex;align-items:center;justify-content:center;width:100%;
        min-height:48px;border-radius:999px;text-decoration:none;font-size:.78rem;font-weight:800;
        letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
      .primary-btn{border:none;background:linear-gradient(135deg,var(--accent),var(--pitch));color:#081320}
      .ghost-link{border:1px solid rgba(122,135,151,.28);background:rgba(255,255,255,.03);color:#d7dee8}
      .foot{margin-top:1rem;text-align:center}
      .foot a{color:var(--muted-soft);text-decoration:none;font-size:.85rem}
      .foot a:hover{color:#fff}
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <div class="brand"><img src="{% static 'football/images/2j-mark.svg' %}" alt="2J Football Intelligence" /></div>
        <div class="eyebrow">{% block eyebrow %}Acceso seguro{% endblock %}</div>
        <h1>{% block heading %}{% endblock %}</h1>
        <p class="sub">{% block subheading %}{% endblock %}</p>
        {% block content %}{% endblock %}
        <div class="foot">{% block foot %}<a href="{% url 'login' %}">← Volver a iniciar sesión</a>{% endblock %}</div>
      </section>
    </main>
  </body>
</html>
