<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Figure Sprite Preview</title>
  <style>
    :root {
      --bg: #0b1523;
      --pitch-a: #4f9c49;
      --pitch-b: #5caa56;
      --line: rgba(255,255,255,0.96);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(37,99,235,0.12), transparent 36%),
        linear-gradient(180deg, #08111c 0%, #0b1523 100%);
      font-family: system-ui, sans-serif;
      color: white;
    }
    .frame {
      width: 1700px;
      height: 1000px;
      padding: 34px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01)),
        #0e1b2b;
      border-radius: 28px;
      box-shadow: 0 40px 120px rgba(0,0,0,0.48);
    }
    .pitch {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.10), transparent 34%),
        repeating-linear-gradient(
          90deg,
          var(--pitch-a) 0 92px,
          var(--pitch-b) 92px 184px
        );
      box-shadow:
        inset 0 0 0 5px rgba(255,255,255,0.72),
        inset 0 0 0 14px rgba(233,255,209,0.22),
        inset 0 -18px 36px rgba(0,0,0,0.16);
    }
    .pitch::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), transparent 18%, transparent 82%, rgba(0,0,0,0.08)),
        repeating-linear-gradient(
          105deg,
          rgba(255,255,255,0.06) 0 2px,
          transparent 2px 36px
        );
      mix-blend-mode: soft-light;
      opacity: 0.7;
      pointer-events: none;
    }
    .line {
      position: absolute;
      background: var(--line);
      border-radius: 999px;
    }
    .v-mid { left: 50%; top: 0; width: 4px; height: 100%; transform: translateX(-50%); }
    .h-mid { top: 50%; left: 0; height: 4px; width: 100%; transform: translateY(-50%); }
    .circle {
      position: absolute;
      width: 212px;
      height: 212px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 4px solid var(--line);
      border-radius: 50%;
    }
    .spot {
      position: absolute;
      width: 12px;
      height: 12px;
      background: rgba(255,255,255,0.98);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .penalty-top, .penalty-bottom {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      height: 160px;
      border: 4px solid var(--line);
    }
    .penalty-top { top: 0; border-top: 0; }
    .penalty-bottom { bottom: 0; border-bottom: 0; }
    .goal-top, .goal-bottom {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 156px;
      height: 58px;
      border: 4px solid var(--line);
    }
    .goal-top { top: 0; border-top: 0; }
    .goal-bottom { bottom: 0; border-bottom: 0; }
    .arc-top, .arc-bottom {
      position: absolute;
      left: 50%;
      width: 120px;
      height: 60px;
      transform: translateX(-50%);
      border: 4px solid var(--line);
      border-radius: 0 0 999px 999px;
      border-top: 0;
      background: transparent;
    }
    .arc-top { top: 155px; }
    .arc-bottom {
      bottom: 155px;
      border-radius: 999px 999px 0 0;
      border-bottom: 0;
      border-top: 4px solid var(--line);
    }
    .sprite {
      position: absolute;
      width: 112px;
      height: 160px;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.20));
    }
    .badge {
      font: 800 16px/1 system-ui, sans-serif;
      fill: #f8fafc;
      text-anchor: middle;
      dominant-baseline: middle;
    }
  </style>
</head>
