<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Model Sprite Viewer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "/football/static/vendor/three/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from '/football/static/vendor/three/build/three.module.js';
    import { GLTFLoader } from '/football/static/vendor/three/examples/jsm/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      preserveDrawingBuffer: true,
    });
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x203040, 1.5);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xffffff, 2.4);
    key.position.set(3.2, 5.8, 5.2);
    key.castShadow = true;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xa8d8ff, 1.2);
    fill.position.set(-4.5, 3.2, 2.5);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xffffff, 0.9);
    rim.position.set(0.5, 4.0, -4.8);
    scene.add(rim);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(1.7, 96),
      new THREE.MeshBasicMaterial({
        color: 0x7fbf2c,
        transparent: true,
        opacity: 0.0,
      }),
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0.01;
    scene.add(floor);

    const shadowPlane = new THREE.Mesh(
      new THREE.CircleGeometry(1.25, 72),
      new THREE.MeshBasicMaterial({
        color: 0x325500,
        transparent: true,
        opacity: 0.0,
      }),
    );
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.position.y = 0.005;
    scene.add(shadowPlane);

    let mixer = null;
    let action = null;
    let playerRoot = null;
    let clock = new THREE.Clock();

    function resize() {
      const width = window.innerWidth || 1024;
      const height = window.innerHeight || 1024;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    function applyMaterials(root) {
      root.traverse((child) => {
        if (!child.isMesh) return;
        child.castShadow = true;
        child.receiveShadow = false;
        if (child.material) {
          child.material.transparent = true;
          child.material.alphaTest = 0.08;
          child.material.depthWrite = true;
          child.material.side = THREE.FrontSide;
        }
      });
    }

    function isolatePrimaryPlayer(root) {
      playerRoot = root;
    }

    function framePlayer() {
      if (!playerRoot) return;
      const box = new THREE.Box3();
      playerRoot.updateWorldMatrix(true, true);
      playerRoot.traverse((child) => {
        if (!child.visible || !child.isBone) return;
        const p = new THREE.Vector3();
        child.getWorldPosition(p);
        box.expandByPoint(p);
      });
      if (box.isEmpty()) return;
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const height = Math.max(size.y, 1.8);
      const radius = Math.max(size.x * 0.7, size.z * 0.7, 0.8);

      playerRoot.position.x -= center.x;
      playerRoot.position.z -= center.z;
      playerRoot.position.y -= box.min.y;

      floor.scale.setScalar(radius * 0.9);
      shadowPlane.scale.set(radius * 0.75, radius * 0.55, 1);
      floor.position.set(0, 0.01, 0);
      shadowPlane.position.set(0, 0.005, 0.08);

      camera.position.set(1.35, 1.55, 5.8);
      camera.lookAt(0, 0.95, 0);
      scene.position.set(0, 0, 0);
      window.__debugInfo = {
        boxMin: box.min.toArray(),
        boxMax: box.max.toArray(),
        size: size.toArray(),
        center: center.toArray(),
        camera: camera.position.toArray(),
      };
    }

    async function loadModel() {
      const loader = new GLTFLoader();
      const gltf = await loader.loadAsync('/tmp/player_model_src/football_soccer_players_animated_rigged_gltf/scene.gltf');
      const root = gltf.scene;
      scene.add(root);
      isolatePrimaryPlayer(root);
      applyMaterials(root);

      if (gltf.animations && gltf.animations.length) {
        mixer = new THREE.AnimationMixer(root);
        action = mixer.clipAction(gltf.animations[0]);
        action.play();
        action.paused = true;
      }

      framePlayer();
      window.__spriteDuration = gltf.animations?.[0]?.duration || 0;
      window.__spriteReady = true;
    }

    window.__setPose = ({ time = 0, yaw = 0, pitch = 0, distance = 3.6 } = {}) => {
      if (mixer) {
        mixer.setTime(time);
      }
      if (playerRoot) {
        playerRoot.rotation.y = yaw;
      }
      const targetY = 0.95;
      const baseHeight = 1.55 + pitch;
      camera.position.set(Math.sin(0.42) * distance, baseHeight, Math.cos(0.42) * distance);
      camera.lookAt(0, targetY, 0);
      renderer.render(scene, camera);
    };

    function render() {
      if (window.__spriteReady === true) {
        renderer.render(scene, camera);
      }
      requestAnimationFrame(render);
    }

    resize();
    window.addEventListener('resize', resize);
    loadModel().catch((error) => {
      window.__spriteReady = `error:${error?.message || error}`;
    });
    render();
  </script>
</body>
</html>
