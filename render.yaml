services:
  - type: web
    name: web-stats
    runtime: python
    plan: standard
    branch: main
    buildCommand: ./build.sh
    startCommand: ./scripts/start_with_ollama.sh
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: GUNICORN_WORKERS
        value: "2"
      - key: GUNICORN_THREADS
        value: "4"
      - key: GUNICORN_KEEPALIVE
        value: "5"
      - key: GUNICORN_GRACEFUL_TIMEOUT
        value: "30"
      # Arranque rápido: `collectstatic` ya se hace en build (`build.sh`).
      - key: RUN_COLLECTSTATIC
        value: "false"
      # MODELO LOCAL APAGADO EN LA WEB (2026-08-07, decision del propietario).
      #
      # Por que: `ollama serve` y el modelo se quedaban RESIDENTES en el mismo contenedor que
      # los workers de gunicorn, comiendo memoria y CPU los usara alguien o no. Medido: la
      # misma pagina de 12 consultas costaba 36 ms de base de datos en calma y 1.185 ms justo
      # despues de cuatro peticiones seguidas -33 veces mas- porque la maquina va ahogada.
      #
      # Que se pierde: texto generado en tres sitios (analisis automatico de la ficha de tarea,
      # consejo del IA-Trainer senior y revision del guardian). Los tres tienen ya su camino sin
      # modelo, asi que degradan solos.
      #
      # Que NO se pierde: el asistente. Las preguntas de datos del club las resuelve el
      # enrutador, sin modelo, en menos de medio segundo. La parte que si usaba el modelo
      # devolvia 502 en 248 ms matando un worker, o sea que no estaba dando servicio: estaba
      # tirando media web cada vez.
      #
      # Para volver a encenderlo: las cuatro a "true". Nada mas. El codigo no cambia.
      - key: INSTALL_OLLAMA
        value: "false"
      - key: ENABLE_OLLAMA
        value: "false"
      - key: OLLAMA_MODEL
        value: "qwen3:1.7b"
      - key: AI_TRAINER_LOCAL_LLM_MODEL
        value: "qwen3:1.7b"
      - key: AI_TRAINER_LOCAL_LLM_ENABLED
        value: "false"
      - key: AI_TRAINER_OLLAMA_URL
        value: "http://127.0.0.1:11434"
      - key: AI_TRAINER_LOCAL_VISION_MODELS
        value: "llama3.2-vision,qwen2.5-vl,minicpm-v"
      - key: OLLAMA_VISION_MODELS
        value: "llama3.2-vision,qwen2.5-vl,minicpm-v"
      - key: OLLAMA_IMAGE_ANALYSIS_MODEL
        value: "llama3.2-vision"
      # Render expone el hostname externo en esta variable; `webstats/settings.py`
      # lo usa para completar `ALLOWED_HOSTS` y CSRF trusted origins.
      - key: RENDER_EXTERNAL_HOSTNAME
        sync: false
      # Obligatorios en producción
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEBUG
        value: "false"
      # Si cambia el esquema, preferimos migrar en build y fallar el deploy antes que
      # levantar la app con código nuevo sobre una base vieja y acabar en 500.
      - key: RUN_MIGRATIONS_AT_BUILD
        value: "true"
      - key: MIGRATE_FAIL_OPEN
        value: "false"
      # Ruta EXPLÍCITA y persistente para los navegadores Playwright. Con "0" el build (root) los
      # instalaba en una ubicación que el runtime (no-root) no podía leer -> PermissionError en
      # /root/.cache/ms-playwright y el render HD/miniaturas server-side fallaba. Con una ruta bajo
      # el checkout del proyecto (persiste build->runtime y es legible), Chromium se encuentra.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "/opt/render/project/src/.pw-browsers"
      # Opcional: instala chromium/firefox/webkit en build (coste CPU/tiempo). Desactivado por defecto.
      - key: INSTALL_PLAYWRIGHT_BROWSERS
        value: "true"
      # Fallback: si los navegadores no quedaron en caché tras el build, Render los reinstala al arrancar.
      - key: INSTALL_PLAYWRIGHT_BROWSERS_AT_RUNTIME
        value: "true"
      # Seguridad: desactiva fallback monoclub en producción si no lo necesitas.
      - key: ALLOW_SINGLE_CLUB_FALLBACK
        value: "false"
      # Ollana: activa el razonamiento LLM dentro del ciclo proactivo del guard. Solo aquí
      # (el web ya arranca Ollama); en el worker NO se pone, así que allí sigue sin LLM ni RAM extra.
      - key: OLLANA_GUARD_LLM_ENABLED
        value: "true"
  # Cron: refresca la clasificación/próximo rival de TODOS los clubes sin intervención.
  # Se despliega solo con la rama (autoDeploy). Horario en UTC: 06:00 y 20:00 a diario
  # (madrugada y tras la franja de partidos de fin de semana en España).
  - type: cron
    name: web-stats-refresh-standings
    runtime: python
    plan: standard
    branch: main
    schedule: "0 6,20 * * *"
    buildCommand: ./build.sh
    # 1) Autolink Universo (server-side): ata equipos nuevos a su liga por nombre. Solo Universo:
    #    La Preferente da 403 desde el datacenter (los senior se vinculan aparte, desde IP residencial).
    #    `|| true` evita que un fallo de autolink bloquee el refresco de clasificaciones.
    # 2) Refresca clasificaciones. 3) Stats de jugadores Preferente.
    startCommand: (python manage.py autolink_competition_contexts --only-universo --commit --sync || true) && python manage.py refresh_competition_snapshots && python manage.py sync_preferente_player_stats --seasons auto
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RUN_MIGRATIONS
        value: "false"
      - key: RUN_COLLECTSTATIC
        value: "false"
      - key: INSTALL_OLLAMA
        value: "false"
      - key: INSTALL_PLAYWRIGHT_BROWSERS
        value: "false"
      - key: INSTALL_PLAYWRIGHT_BROWSERS_AT_RUNTIME
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEBUG
        value: "false"

  - type: worker
    name: web-stats-ollana-operator
    runtime: python
    plan: standard
    branch: main
    # Instala también las deps de avatares y baja el modelo. NO fatal: si algo falla, el
    # worker (operador) sigue arrancando igual; la autogeneración de avatares simplemente no corre.
    buildCommand: ./build.sh && ( pip install -r requirements-avatars.txt && bash scripts/fetch_avatar_model.sh || echo "[avatars] setup opcional falló; el operador sigue" )
    startCommand: ./scripts/start_ollana_operator_worker.sh
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RUN_MIGRATIONS
        value: "false"
      # --- Autogeneración de avatares (reusa este worker; sin servicio nuevo) ---
      # DESACTIVADO: generate_player_avatars carga insightface+onnx (+modelo 554MB) y, sumado a
      # ollama (qwen3), supera los 2GB del plan standard -> OOM en bucle cada ~120s -> emails de
      # fallo sin parar. Las chapas ya se generan en servidor con PIL (sin modelos), así que no
      # hace falta esto en prod. Para reactivarlo hay que subir el worker a 'pro' (>=4GB) y poner
      # AVATAR_AUTOGEN_ENABLED=true (aquí y, si estuviera override, en el dashboard).
      - key: AVATAR_AUTOGEN_ENABLED
        value: "false"
      - key: AVATAR_AUTOGEN_INTERVAL_SECONDS
        value: "86400"
      - key: AVATAR_INSWAPPER
        value: "/opt/render/project/src/vendor/inswapper_128.onnx"
      # Guarda los avatares en el MISMO S3 que el web (credenciales AWS ya puestas en el worker).
      - key: USE_S3_MEDIA
        value: "true"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: OLLANA_OPERATOR_ENABLED
        value: "true"
      - key: OLLANA_OPERATOR_WORKSPACE_ID
        sync: false
      - key: OLLANA_OPERATOR_ACTOR_ID
        sync: false
      - key: OLLANA_OPERATOR_SLEEP_SECONDS
        value: "30"
      - key: OLLANA_OPERATOR_MAX_RUNTIME_SECONDS
        value: "0"
      - key: OLLANA_OPERATOR_FORCE
        value: "true"
      - key: OLLANA_ADMIN_AUTONOMY_ENABLE_RELEASES
        value: "false"
      - key: OLLANA_RENDER_API_KEY
        sync: false
      - key: AI_TRAINER_LOCAL_VISION_MODELS
        value: "llama3.2-vision,qwen2.5-vl,minicpm-v"
      - key: OLLAMA_VISION_MODELS
        value: "llama3.2-vision,qwen2.5-vl,minicpm-v"
      - key: OLLAMA_IMAGE_ANALYSIS_MODEL
        value: "llama3.2-vision"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEBUG
        value: "false"
      # Fallback: si el browser no quedó en caché tras el build, Render lo reinstala al arrancar.
      - key: INSTALL_PLAYWRIGHT_BROWSERS_AT_RUNTIME
        value: "true"
